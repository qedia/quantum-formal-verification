name = "qhl"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Qhl"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
# Project-local relaxations of the mathlib linter set: no copyright headers,
# and fixture instances ([Fintype (D i)] etc.) are declared once per file
# rather than minimized per lemma.
weak.linter.style.header = false
weak.linter.unusedSectionVars = false
weak.linter.unusedFintypeInType = false
weak.linter.unusedDecidableInType = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc1"

[[lean_lib]]
name = "Qhl"
roots = ["Qhl", "Qhl.Examples", "Qhl.Tests"]
